name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install jsonschema
      - name: Validate data/*.json against data/schemas/
        run: python scripts/validate-data.py
      - name: Skills match the principles and the skill data
        run: python scripts/check-skills.py
      - name: Generated principles/*.md are up to date
        run: python scripts/build-principles.py --check
      - name: Generated agents/ and commands/ are up to date
        run: python scripts/build-agents.py --check
      - name: Generated docs/ site is up to date
        run: python scripts/build-site.py --check
      - name: Check internal links in docs/ and markdown
        run: python scripts/check-links.py
      - name: new-project.sh works for every harness, writing only inside the target
        run: python scripts/check-new-project.py

  skillspector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SkillSpector (NVIDIA, Apache-2.0) and PyYAML
        run: python -m pip install "skillspector==2.13.7" pyyaml
      - name: Scan skills/ with SkillSpector (static, no LLM, fails on any unexplained finding)
        run: python scripts/skillspector-scan.py
