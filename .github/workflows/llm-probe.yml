name: LLM probe (temporary)
on:
  pull_request:
    paths: [".github/workflows/llm-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe models
        env:
          NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error
          key = os.environ["NVIDIA_INFERENCE_KEY"]
          models = ["z-ai/glm-5.3-flash", "meta/llama-3.3-70b-instruct", "nvidia/llama-3.3-nemotron-super-49b-v1.5", "meta/llama-3.1-8b-instruct", "openai/gpt-oss-120b", "deepseek-ai/deepseek-v3.2"]
          for m in models:
              body = json.dumps({"model": m, "messages": [{"role": "user", "content": "Say ok"}], "max_tokens": 16}).encode()
              req = urllib.request.Request("https://integrate.api.nvidia.com/v1/chat/completions", data=body, method="POST",
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      out = r.read().decode()[:200]
                      print(m, r.status, f"{time.time()-t:.1f}s", out.replace(key, "***"), flush=True)
              except urllib.error.HTTPError as e:
                  print(m, "HTTP", e.code, f"{time.time()-t:.1f}s", e.read().decode()[:200].replace(key, "***"), flush=True)
              except Exception as e:
                  print(m, "ERR", type(e).__name__, f"{time.time()-t:.1f}s", flush=True)
          PY
